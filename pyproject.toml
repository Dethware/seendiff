[project]
name = "seendiff"
version = "0.1.0"
description = "Local point-in-time diff reviewer with persistent review state"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "unidiff>=0.7.5",
    "pygments==2.20.0",
]

[project.scripts]
seendiff = "seendiff.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seendiff*"]

[tool.setuptools.package-data]
seendiff = ["static/*", "static/fonts/*"]
