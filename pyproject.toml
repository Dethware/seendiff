[project]
name = "seendiff"
version = "0.1.0"
description = "Local point-in-time diff tool with persistent review state"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "unidiff>=0.7.5",
    "pygments==2.20.0",
]

[project.scripts]
seendiff = "seendiff.cli:main"
git-cm = "seendiff.gitcm:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seendiff*"]

[tool.setuptools.package-data]
seendiff = ["static/*", "static/fonts/*"]
